name: Résultat du Quinté+

on:
  schedule:
    # Toutes les dix minutes, de 8 h à 22 h 50 UTC (9 h à 23 h 50 à Paris). L’arrivée est relevée une heure après le
    # départ, puis à chaque passage jusqu’à publication. Rien n’est écrit tant que rien ne change.
    - cron: '*/10 8-22 * * *'
  workflow_dispatch:
    inputs:
      forcer_programme:
        description: 'Relever le programme du jour à toute heure'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quinte
  cancel-in-progress: false

jobs:
  resultat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Relever l'arrivée et les rapports
        env:
          FORCER: ${{ inputs.forcer_programme && '--forcer-programme' || '' }}
        run: python3 src/quinte.py maj $FORCER
      - name: Ajouter le résultat à la page du jour et envoyer s'il a changé
        run: |
          python3 src/page.py
          if git diff --quiet -- data/quinte/jours.json '*.html'; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quinte/jours.json '*.html'
          git commit -m "Quinté+ : résultat et rapports"
          delai=2
          for essai in 1 2 3 4; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo "Résultat envoyé (essai $essai)."
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$essai" -lt 4 ]; then
              echo "Envoi refusé (essai $essai) ; nouvel essai dans $delai s."
              sleep "$delai"
              delai=$((delai * 2))
            fi
          done
          echo "L'envoi du résultat a échoué après 4 essais." >&2
          exit 1
